dependencies:
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    labels:
      app: llama32-1b
      trainer.kubeflow.org/framework: torch
    name: llama32-1b-runtime
  spec:
    mlPolicy:
      numNodes: {{ .NodesPerJob }}
      torch:
        numProcPerNode: {{ .GpusPerNode }}
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              backoffLimit: 0
              template:
                spec:
                  dnsPolicy: ClusterFirstWithHostNet
                  hostNetwork: true
                  runtimeClassName: nvidia
                  restartPolicy: Never
                  containers:
                  - name: node
                    image: nvcr.io/nvidia/pytorch:26.01-py3
                    env:
                    - name: NCCL_DEBUG
                      value: INFO
                    - name: NCCL_MNNVL_ENABLE
                      value: "0"
                    - name: NCCL_NET
                      value: IB
                    - name: NCCL_NET_PLUGIN
                      value: none
                    - name: NCCL_IB_DISABLE
                      value: "0"
                    - name: NCCL_IB_HCA
                      value: "=rocep1s0f1:1,roceP2p1s0f1:1"
                    - name: NCCL_SOCKET_IFNAME
                      value: "=enp1s0f1np1"
                    - name: NCCL_SOCKET_FAMILY
                      value: AF_INET
                    - name: NCCL_CROSS_NIC
                      value: "0"
                    resources:
                      limits:
                        cpu: "{{ .TrainingCPULimit }}"
                        memory: "{{ .TrainingMemoryLimit }}"
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
{{- range .NicResources }}
                        {{ .Name }}: "{{ .Quantity }}"
{{- end }}
                      requests:
                        cpu: "{{ .TrainingCPURequest }}"
                        memory: "{{ .TrainingMemoryRequest }}"
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
{{- range .NicResources }}
                        {{ .Name }}: "{{ .Quantity }}"
{{- end }}
                  tolerations:
                  - key: kubernetes.io/arch
                    operator: Equal
                    value: arm64
                    effect: NoSchedule
                  - key: nvidia.com/gpu
                    operator: Exists
                    effect: NoSchedule
jobTemplate:
  spec:
    stallMultiplier: 4
    startupStallTimeoutSeconds: 600
    goodputMeasurement:
      logProfileRef: megatron-training
      sampleInterval: 5s
    nodeHealthMonitor:
      cel:
        expression: node.spec.unschedulable == true
    workload:
      trainJob:
        runtimeRef:
          kind: TrainingRuntime
          name: llama32-1b-runtime
        trainer:
          command:
          - /bin/bash
          - -ceu
          args:
          - |
            exec torchrun \
              --nnodes="${PET_NNODES}" \
              --nproc-per-node="${PET_NPROC_PER_NODE}" \
              --node-rank="${PET_NODE_RANK}" \
              --rdzv-backend=c10d \
              --rdzv-endpoint="${PET_MASTER_ADDR}:${PET_MASTER_PORT}" \
              --rdzv-id=gb10-llama32-1b \
              /usr/local/bin/gb10-llama32-1b.py \
              --steps "{{ .MaxSteps }}" \
              --sequence-length 1024
          image: nvcr.io/nvidia/pytorch:26.01-py3
          numNodes: {{ .NodesPerJob }}
          numProcPerNode: {{ .GpusPerNode }}
orchestration:
  execution:
{{- if gt .MaxConcurrent 0 }}
    maxConcurrent: {{ .MaxConcurrent }}
{{- end }}
    timeoutPerJob: {{ .TimeoutPerJob }}
  iterations: 1
{{- if .Thresholds }}
validation:
  performance:
    enabled: true
{{- if .MeasurementTimeout }}
    measurementTimeout: {{ .MeasurementTimeout }}
{{- end }}
    thresholds:
      thresholds:
{{- range $k, $v := .Thresholds }}
        {{ $k }}: "{{ $v }}"
{{- end }}
{{- end }}
